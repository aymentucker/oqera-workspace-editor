[package]
name = "oqera"
version = "0.1.0"
description = "Oqera intelligent developer workspace"
authors = ["Oqera"]
edition = "2021"

[lib]
name = "oqera_lib"
crate-type = ["staticlib","cdylib","rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
